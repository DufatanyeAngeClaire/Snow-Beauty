<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Admin Dashboard</h1>
</div>

<div class="row g-4 mb-4">

    <!-- Pending Salons -->
    <div class="col-sm-6 col-md-3">
        <div class="card text-white bg-warning h-100 shadow-sm rounded-3 hover-card">
            <div class="card-body d-flex flex-column justify-content-center align-items-center">
                <i data-feather="clock" class="mb-2" width="36" height="36"></i>
                <h5 class="card-title">Pending Salons</h5>
                <p class="card-text fs-4 fw-bold">{{ pending_salons_count }}</p>
            </div>
        </div>
    </div>

    <!-- Approved Salons -->
    <div class="col-sm-6 col-md-3">
        <div class="card text-white bg-success h-100 shadow-sm rounded-3 hover-card">
            <div class="card-body d-flex flex-column justify-content-center align-items-center">
                <i data-feather="check-circle" class="mb-2" width="36" height="36"></i>
                <h5 class="card-title">Approved Salons</h5>
                <p class="card-text fs-4 fw-bold">{{ approved_salons_count }}</p>
            </div>
        </div>
    </div>

    <!-- Total Users -->
    <div class="col-sm-6 col-md-3">
        <div class="card text-white bg-primary h-100 shadow-sm rounded-3 hover-card">
            <div class="card-body d-flex flex-column justify-content-center align-items-center">
                <i data-feather="users" class="mb-2" width="36" height="36"></i>
                <h5 class="card-title">Total Users</h5>
                <p class="card-text fs-4 fw-bold">{{ total_users }}</p>
            </div>
        </div>
    </div>

    <!-- Pending Appointments -->
    <div class="col-sm-6 col-md-3">
        <div class="card text-white bg-danger h-100 shadow-sm rounded-3 hover-card">
            <div class="card-body d-flex flex-column justify-content-center align-items-center">
                <i data-feather="calendar" class="mb-2" width="36" height="36"></i>
                <h5 class="card-title">Pending Appointments</h5>
                <p class="card-text fs-4 fw-bold">{{ pending_appointments_count }}</p>
            </div>
        </div>
    </div>

</div>

<!-- Feather Icons -->
<script src="https://unpkg.com/feather-icons"></script>
<script>
    feather.replace();
</script>

<style>
    .hover-card {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        cursor: pointer;
    }

    .hover-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .card-title, .card-text {
        text-align: center;
    }

    i[data-feather] {
        display: block;
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const mainContent = document.getElementById('main-content');

    // -------------------------------
    // Utility to fetch and update HTML
    // -------------------------------
    async function fetchAndUpdate(url, options = {}) {
        try {
            const res = await fetch(url, {
                ...options,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': getCSRFToken(),
                    ...(options.headers || {})
                }
            });
            const data = await res.json();
            if (data.html) mainContent.innerHTML = data.html;
            rebindAll(); // rebind events
            return data;
        } catch (err) {
            console.error(err);
            mainContent.innerHTML = "<p class='text-danger p-4'>Failed to load content.</p>";
        }
    }

    // -------------------------------
    // CSRF Token Helper
    // -------------------------------
    function getCSRFToken() {
        const csrf = document.querySelector('[name=csrfmiddlewaretoken]');
        return csrf ? csrf.value : '';
    }

    // -------------------------------
    // USERS
    // -------------------------------
    async function loadUsers(role = '') {
        const url = `/admin/users/?role=${role}`;
        await fetchAndUpdate(url);
    }

    function rebindUserEvents() {
        document.querySelectorAll('.edit-user-btn').forEach(btn => {
            btn.onclick = async function () {
                const userId = this.dataset.id;
                const res = await fetch(`/admin/edit_user/${userId}/?ajax=1`);
                const user = await res.json();

                // Fill form for editing
                const form = document.getElementById('user-form');
                form.user_id.value = user.id;
                form.username.value = user.username;
                form.email.value = user.email;
                form.password1.value = '';
                form.password2.value = '';
                form.role.value = user.role;

                // Show/hide role fields
                showFieldsForRole(user.role);

                if (user.role === 'salon' || user.role === 'shop') {
                    form.salon_name.value = user.salon_name || '';
                    form.salon_address.value = user.salon_address || '';
                } else if (user.role === 'provider') {
                    form.provider_address.value = user.provider_address || '';
                    document.querySelectorAll('input[name="service_types"]').forEach(cb => {
                        cb.checked = user.service_types.includes(cb.value);
                    });
                }

                document.getElementById('form-title').textContent = 'Edit User';
                document.getElementById('submit-btn').textContent = 'Update User';
                document.getElementById('cancel-edit').style.display = 'block';
            };
        });

        document.querySelectorAll('.delete-user-btn').forEach(btn => {
            btn.onclick = async function () {
                if (!confirm("Are you sure you want to delete this user?")) return;
                const userId = this.dataset.id;
                await fetchAndUpdate(`/admin/delete_user/${userId}/`, { method: 'POST' });
            };
        });

        document.querySelectorAll('.toggle-user-btn').forEach(btn => {
            btn.onclick = async function () {
                const userId = this.dataset.id;
                await fetchAndUpdate(`/admin/toggle_user_status/${userId}/`, { method: 'POST' });
            };
        });
    }

    // -------------------------------
    // SERVICES
    // -------------------------------
    function rebindServiceEvents() {
        document.querySelectorAll('.edit-service-btn').forEach(btn => {
            btn.onclick = async function () {
                const serviceId = this.dataset.id;
                const res = await fetch(`/admin/edit_service/${serviceId}/`, { method: 'GET' });
                const data = await res.json();
                // populate form fields
                const form = document.getElementById('service-form');
                if (form) {
                    form.name.value = data.name;
                    form.price.value = data.price;
                    form.duration_minutes.value = data.duration_minutes;
                    form.service_type.value = data.service_type;
                    form.featured.checked = data.featured;
                    form.salon.value = data.salon;
                }
            };
        });

        document.querySelectorAll('.delete-service-btn').forEach(btn => {
            btn.onclick = async function () {
                if (!confirm("Delete this service?")) return;
                const serviceId = this.dataset.id;
                await fetchAndUpdate(`/admin/delete_service/${serviceId}/`, { method: 'POST' });
            };
        });
    }

    // -------------------------------
    // PRODUCTS
    // -------------------------------
    function rebindProductEvents() {
        document.querySelectorAll('.edit-product-btn').forEach(btn => {
            btn.onclick = async function () {
                const productId = this.dataset.id;
                const res = await fetch(`/admin/product/${productId}/`, { method: 'GET' });
                const data = await res.json();
                const form = document.getElementById('product-form');
                if (form) {
                    form.name.value = data.name;
                    form.price.value = data.price;
                    form.description.value = data.description;
                    form.featured.checked = data.featured;
                }
            };
        });

        document.querySelectorAll('.delete-product-btn').forEach(btn => {
            btn.onclick = async function () {
                if (!confirm("Delete this product?")) return;
                const productId = this.dataset.id;
                await fetchAndUpdate(`/admin/delete_product/${productId}/`, { method: 'POST' });
            };
        });
    }

    // -------------------------------
    // Show Role Fields
    // -------------------------------
    function showFieldsForRole(role) {
        document.querySelectorAll('.role-fields').forEach(f => f.style.display = 'none');
        if (role === 'salon' || role === 'shop') {
            document.getElementById('salon-fields').style.display = 'block';
        } else if (role === 'provider') {
            document.getElementById('provider-fields').style.display = 'block';
        }
    }

    // -------------------------------
    // Rebind everything after AJAX
    // -------------------------------
    function rebindAll() {
        rebindUserEvents();
        rebindServiceEvents();
        rebindProductEvents();
    }

    // -------------------------------
    // Initial bindings
    // -------------------------------
    rebindAll();

    // Sidebar role filter for users
    document.querySelectorAll('.load-users-role').forEach(link => {
        link.onclick = async function (e) {
            e.preventDefault();
            const role = this.dataset.role;
            await loadUsers(role);
        };
    });

    // Cancel edit
    const cancelBtn = document.getElementById('cancel-edit');
    if (cancelBtn) cancelBtn.onclick = function () {
        const form = document.getElementById('user-form');
        form.reset();
        form.user_id.value = '';
        document.getElementById('form-title').textContent = 'Add User';
        document.getElementById('submit-btn').textContent = 'Add User';
        cancelBtn.style.display = 'none';
        showFieldsForRole('user');
    };

});
</script>
