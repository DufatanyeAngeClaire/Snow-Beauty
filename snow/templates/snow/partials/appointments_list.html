<!-- snow/templates/snow/partials/appointments_list.html -->
<div class="p-4">
    <h3>Appointments</h3>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>#</th>
                <th>User</th>
                <th>Salon</th>
                <th>Service</th>
                <th>Date & Time</th>
            </tr>
        </thead>
        <tbody>
            {% for appointment in appointments %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ appointment.user.username }}</td>
                <td>{{ appointment.salon.name }}</td>
                <td>{{ appointment.service.name }}</td>
                <td>{{ appointment.date_time|date:"Y-m-d H:i" }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center text-muted">No appointments scheduled</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
