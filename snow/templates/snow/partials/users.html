
<div class="container mt-4">
    <h3 class="mb-4">User Management</h3>

    <!-- Filter by Role -->
    <div class="mb-3">
        <label for="roleFilter" class="form-label">Filter by Role:</label>
        <select id="roleFilter" class="form-select">
            <option value="">All</option>
            {% for key, label in roles %}
                <option value="{{ key }}">{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Add/Edit User Form -->
    <div class="card mb-4 p-3">
        <h5 id="form-title">Register User</h5>
        <div id="user-form-errors" class="text-danger mb-2"></div>

        <form id="add-user-form" method="post" action="{% url 'add_user' %}">
            {% csrf_token %}
            <input type="hidden" id="edit-user-id" name="user_id">

            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" name="username" id="id_username" class="form-control" placeholder="Username" required>
                </div>
                <div class="col-md-4">
                    <input type="email" name="email" id="id_email" class="form-control" placeholder="Email" required>
                </div>
                <div class="col-md-4">
                    <select name="role" id="id_role" class="form-select" required>
                        {% for key, label in roles %}
                            <option value="{{ key }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <input type="password" name="password1" id="id_password1" class="form-control" placeholder="Password" required>
                </div>
                <div class="col-md-6">
                    <input type="password" name="password2" id="id_password2" class="form-control" placeholder="Confirm Password" required>
                </div>
            </div>

            <!-- Salon/Business Fields -->
            <div id="salon-fields" class="mt-4 d-none border-top pt-3">
                <h6>Business / Salon Details</h6>
                <div class="row g-3">
                    <div class="col-md-6">
                        <input type="text" name="salon_name" class="form-control" placeholder="Business / Salon Name">
                    </div>
                    <div class="col-md-6">
                        <input type="text" name="salon_address" class="form-control" placeholder="Business / Salon Address">
                    </div>
                </div>
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-primary" id="user-submit-btn">Register</button>
                <button type="button" class="btn btn-secondary d-none" id="cancel-edit-btn">Cancel</button>
            </div>
        </form>
    </div>

    <!-- Users Table -->
    <div id="users-section">
        {% include "snow/partials/users_list.html" %}
    </div>
</div>

<!-- AJAX Script -->
<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('add-user-form');
    const roleSelect = document.getElementById('id_role');
    const salonFields = document.getElementById('salon-fields');
    const usersSection = document.getElementById('users-section');
    const errorsDiv = document.getElementById('user-form-errors');
    const submitBtn = document.getElementById('user-submit-btn');
    const cancelBtn = document.getElementById('cancel-edit-btn');
    const formTitle = document.getElementById('form-title');
    const rolesWithSalon = ['salon', 'shop', 'provider'];

    // Toggle salon/business fields based on role
    function toggleSalonFields() {
        if (rolesWithSalon.includes(roleSelect.value)) {
            salonFields.classList.remove('d-none');
        } else {
            salonFields.classList.add('d-none');
        }
    }
    roleSelect.addEventListener('change', toggleSalonFields);
    toggleSalonFields();

    // Add/Edit user form submit (AJAX)
    form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorsDiv.innerText = '';
        const formData = new FormData(form);
        submitBtn.disabled = true;
        submitBtn.innerText = 'Saving...';

        fetch(form.action, {
            method: 'POST',
            headers: { 'X-Requested-With': 'XMLHttpRequest' },
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Register';

            if (data.success) {
                usersSection.innerHTML = data.html;
                form.reset();
                toggleSalonFields();
                formTitle.innerText = 'Register User';
                cancelBtn.classList.add('d-none');
            } else {
                errorsDiv.innerText = data.error || 'Failed to save user.';
            }
        })
        .catch(() => {
            submitBtn.disabled = false;
            errorsDiv.innerText = 'Server error. Please try again.';
        });
    });

    // Cancel edit
    cancelBtn.addEventListener('click', function () {
        form.reset();
        document.getElementById('edit-user-id').value = '';
        formTitle.innerText = 'Register User';
        submitBtn.innerText = 'Register';
        cancelBtn.classList.add('d-none');
    });

    // Delegate actions (edit, delete, toggle)
    usersSection.addEventListener('click', function (e) {
        const target = e.target;

        // Delete user
        if (target.classList.contains('delete-user-btn')) {
            const id = target.dataset.id;
            if (confirm('Are you sure you want to delete this user?')) {
                fetch(`/admin/users/delete/${id}/`, {
                    method: 'POST',
                    headers: { 'X-Requested-With': 'XMLHttpRequest', 'X-CSRFToken': '{{ csrf_token }}' }
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        usersSection.innerHTML = data.html;
                    } else {
                        alert('Failed to delete user.');
                    }
                });
            }
        }

        // Toggle approval
        if (target.classList.contains('toggle-user-btn')) {
            const id = target.dataset.id;
            fetch(`/admin/users/toggle/${id}/`, {
                method: 'POST',
                headers: { 'X-Requested-With': 'XMLHttpRequest', 'X-CSRFToken': '{{ csrf_token }}' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    usersSection.innerHTML = data.html;
                }
            });
        }

        // Edit user
        if (target.classList.contains('edit-user-btn')) {
            const id = target.dataset.id;
            fetch(`/admin/users/edit/${id}/`, {
                method: 'GET',
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.success && data.user) {
                    document.getElementById('id_username').value = data.user.username;
                    document.getElementById('id_email').value = data.user.email;
                    document.getElementById('id_role').value = data.user.role;
                    toggleSalonFields();
                    document.getElementById('edit-user-id').value = id;
                    form.action = `/admin/users/edit/${id}/`;
                    formTitle.innerText = 'Edit User';
                    submitBtn.innerText = 'Update';
                    cancelBtn.classList.remove('d-none');
                }
            });
        }
    });
});
</script>
