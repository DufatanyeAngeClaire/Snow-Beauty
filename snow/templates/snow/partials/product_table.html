<div id="products-section">
    <table class="table table-bordered mt-4">
        <thead>
            <tr>
                <th>#</th>
                <th>Image</th>
                <th>Name</th>
                <th>Price</th>
                <th>Description</th>
                <th>Featured</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>
                    {% if product.image %}
                        <img src="{{ product.image.url }}" width="60">
                    {% else %}
                        —
                    {% endif %}
                </td>
                <td>{{ product.name }}</td>
                <td>{{ product.price }}</td>
                <td>{{ product.description }}</td>
                <td>{{ product.featured|yesno:"Yes,No" }}</td>
                <td>
                    <button class="btn btn-sm btn-warning edit-product-btn" data-id="{{ product.id }}">Edit</button>
                    <button class="btn btn-sm btn-danger delete-product-btn" data-id="{{ product.id }}">Delete</button>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="7" class="text-center">No products</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
