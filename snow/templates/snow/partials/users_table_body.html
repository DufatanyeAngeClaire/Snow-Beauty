{% for user in users %}
<tr id="user-{{ user.id }}">
    <td>{{ user.username }}</td>
    <td>{{ user.email }}</td>
    <td>{{ user.get_role_display }}</td>
    <td>
        {% if user.is_approved %}
            <span class="badge bg-success">Approved</span>
        {% else %}
            <span class="badge bg-warning">Pending</span>
        {% endif %}
    </td>
    <td>
        <button class="btn btn-sm btn-primary edit-user-btn" data-id="{{ user.id }}">Edit</button>
        <button class="btn btn-sm btn-danger delete-user-btn" data-id="{{ user.id }}">Delete</button>
        {% if user.is_approved %}
            <button class="btn btn-sm btn-warning toggle-user-btn" data-id="{{ user.id }}">Set Pending</button>
        {% else %}
            <button class="btn btn-sm btn-success toggle-user-btn" data-id="{{ user.id }}">Approve</button>
        {% endif %}
    </td>
</tr>
{% endfor %}

<script>
document.addEventListener('DOMContentLoaded', function() {
    // ------------------------------
    // Edit User
    // ------------------------------
    document.querySelectorAll('.edit-user-btn').forEach(btn => {
        btn.addEventListener('click', async function() {
            const userId = this.dataset.id;
            try {
                const res = await fetch(`/admin/users/${userId}/`, {
                    headers: {'X-Requested-With': 'XMLHttpRequest'}
                });
                const data = await res.json();
                if(data.user) {
                    // Call your global function from register form
                    loadUserForEdit(data.user);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    alert('Failed to load user data');
                }
            } catch(err) {
                console.error(err);
                alert('Error fetching user data');
            }
        });
    });

    // ------------------------------
    // Delete User
    // ------------------------------
    document.querySelectorAll('.delete-user-btn').forEach(btn => {
        btn.addEventListener('click', async function() {
            const userId = this.dataset.id;
            if(!confirm('Are you sure you want to delete this user?')) return;

            try {
                const res = await fetch(`/admin/users/delete/${userId}/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                const data = await res.json();
                if(data.success) {
                    const row = document.getElementById(`user-${userId}`);
                    if(row) row.remove();
                } else {
                    alert(data.error || 'Failed to delete user');
                }
            } catch(err) {
                console.error(err);
                alert('Error deleting user');
            }
        });
    });

    // ------------------------------
    // Toggle Approval
    // ------------------------------
    document.querySelectorAll('.toggle-user-btn').forEach(btn => {
        btn.addEventListener('click', async function() {
            const userId = this.dataset.id;
            try {
                const res = await fetch(`/admin/users/toggle-approval/${userId}/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                const data = await res.json();
                if(data.success) {
                    const row = document.getElementById(`user-${userId}`);
                    const statusCell = row.querySelector('td:nth-child(4)');
                    const toggleBtn = row.querySelector('.toggle-user-btn');

                    if(data.is_approved) {
                        statusCell.innerHTML = '<span class="badge bg-success">Approved</span>';
                        toggleBtn.textContent = 'Set Pending';
                        toggleBtn.classList.remove('btn-success');
                        toggleBtn.classList.add('btn-warning');
                    } else {
                        statusCell.innerHTML = '<span class="badge bg-warning">Pending</span>';
                        toggleBtn.textContent = 'Approve';
                        toggleBtn.classList.remove('btn-warning');
                        toggleBtn.classList.add('btn-success');
                    }
                } else {
                    alert(data.error || 'Failed to toggle approval');
                }
            } catch(err) {
                console.error(err);
                alert('Error toggling user approval');
            }
        });
    });
});
</script>
